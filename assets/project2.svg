<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1f152d" />
    </linearGradient>
    <linearGradient id="wp-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="wp-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="wp-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#wp-bg)"/>

  <!-- App Window -->
  <g transform="translate(50, 35)" filter="url(#wp-shadow)">
    <rect width="700" height="430" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="700" height="42" rx="14" fill="#020617"/>
    <!-- Dots -->
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="350" y="26" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Digital Wedding Planning Platform (Bangladesh) — 82-Feature MVP Specification</text>

    <!-- Content Area -->
    <g transform="translate(30, 60)">
      <!-- Top 3 Spec Cards -->
      <g>
        <rect width="200" height="85" rx="8" fill="url(#wp-card)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">82 Feature Specification</text>
        <text x="16" y="52" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">MVP Architecture</text>
        <text x="16" y="70" fill="#10b981" font-family="sans-serif" font-size="10">● Full Event Lifecycle Covered</text>
      </g>

      <g transform="translate(220, 0)">
        <rect width="200" height="85" rx="8" fill="url(#wp-card)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Workspace Permissions</text>
        <text x="16" y="52" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Family &amp; Vendor Roles</text>
        <text x="16" y="70" fill="#38bdf8" font-family="sans-serif" font-size="10">● Granular access control</text>
      </g>

      <g transform="translate(440, 0)">
        <rect width="200" height="85" rx="8" fill="url(#wp-card)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Pre-Launch Gap Analysis</text>
        <text x="16" y="52" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">De-Risked Architecture</text>
        <text x="16" y="70" fill="#fbbf24" font-family="sans-serif" font-size="10">● RSVP &amp; Auth recovery solved</text>
      </g>

      <!-- Bottom: System Architecture Flow -->
      <g transform="translate(0, 105)">
        <rect width="640" height="235" rx="8" fill="url(#wp-card)" stroke="#334155" stroke-width="1"/>
        <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Centralized Event Coordination Workflow</text>
        
        <!-- Step 1: Workspace Creation -->
        <g transform="translate(20, 60)">
          <rect width="130" height="135" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
          <text x="65" y="35" fill="#f472b6" font-size="20" text-anchor="middle">💍</text>
          <text x="65" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Family Workspace</text>
          <text x="65" y="90" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Multi-host planning</text>
          <text x="65" y="110" fill="#22c55e" font-family="sans-serif" font-size="9" text-anchor="middle">RBAC Permissions</text>
        </g>

        <!-- Arrow 1 -->
        <path d="M 155 125 L 185 125" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3"/>

        <!-- Step 2: Guest & Token Invitation -->
        <g transform="translate(190, 60)">
          <rect width="130" height="135" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
          <text x="65" y="35" fill="#818cf8" font-size="20" text-anchor="middle">🎟️</text>
          <text x="65" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Token Invitations</text>
          <text x="65" y="90" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Secure QR / SMS</text>
          <text x="65" y="110" fill="#818cf8" font-family="sans-serif" font-size="9" text-anchor="middle">RSVP Verification</text>
        </g>

        <!-- Arrow 2 -->
        <path d="M 325 125 L 355 125" stroke="#6366f1" stroke-width="2" stroke-dasharray="3,3"/>

        <!-- Step 3: Vendor Coordination -->
        <g transform="translate(360, 60)">
          <rect width="130" height="135" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="65" y="35" fill="#fbbf24" font-size="20" text-anchor="middle">📋</text>
          <text x="65" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vendor Management</text>
          <text x="65" y="90" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Catering, Venue, Photo</text>
          <text x="65" y="110" fill="#fbbf24" font-family="sans-serif" font-size="9" text-anchor="middle">Milestone tracker</text>
        </g>

        <!-- Arrow 3 -->
        <path d="M 495 125 L 525 125" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3"/>

        <!-- Step 4: Live Event Ops -->
        <g transform="translate(530, 60)">
          <rect width="90" height="135" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
          <text x="45" y="35" fill="#34d399" font-size="20" text-anchor="middle">⚡</text>
          <text x="45" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live Ops</text>
          <text x="45" y="90" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Guest Entry</text>
          <text x="45" y="110" fill="#10b981" font-family="sans-serif" font-size="9" text-anchor="middle">De-Risked</text>
        </g>
      </g>
    </g>
  </g>
</svg>
