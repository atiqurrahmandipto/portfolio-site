<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bg-grad)" stroke="url(#avatar-grad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="50" x2="100" y2="350"/>
    <line x1="200" y1="20" x2="200" y2="380"/>
    <line x1="300" y1="50" x2="300" y2="350"/>
    <line x1="50" y1="100" x2="350" y2="100"/>
    <line x1="20" y1="200" x2="380" y2="200"/>
    <line x1="50" y1="300" x2="350" y2="300"/>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Body / Shoulders -->
  <path d="M 110 360 C 110 280, 150 255, 200 255 C 250 255, 290 280, 290 360 Z" fill="url(#avatar-grad)" opacity="0.9"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="55" fill="#f8fafc"/>
  <!-- Hair / Modern Style -->
  <path d="M 145 175 C 145 125, 175 115, 200 115 C 235 115, 255 135, 255 175 C 245 160, 230 155, 215 155 C 190 155, 170 165, 145 175 Z" fill="#1e293b"/>
  <!-- Stylish Glasses -->
  <rect x="160" y="170" width="32" height="22" rx="6" fill="none" stroke="#6366f1" stroke-width="3.5"/>
  <rect x="208" y="170" width="32" height="22" rx="6" fill="none" stroke="#6366f1" stroke-width="3.5"/>
  <line x1="192" y1="181" x2="208" y2="181" stroke="#6366f1" stroke-width="3.5"/>
  <!-- Modern Headphones -->
  <path d="M 135 180 C 135 130, 265 130, 265 180" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <rect x="130" y="170" width="14" height="28" rx="6" fill="#06b6d4"/>
  <rect x="256" y="170" width="14" height="28" rx="6" fill="#06b6d4"/>

  <!-- Tech Badges Floating -->
  <!-- Left Badge: Code < / > -->
  <g transform="translate(60, 140)">
    <rect width="64" height="34" rx="17" fill="url(#glass)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="32" y="22" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <!-- Right Badge: ⚡ -->
  <g transform="translate(280, 110)">
    <rect width="60" height="34" rx="17" fill="url(#glass)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="30" y="22" fill="#fbbf24" font-family="sans-serif" font-size="16" text-anchor="middle">⚡ 99%</text>
  </g>
  <!-- Bottom Status Pill -->
  <g transform="translate(125, 340)">
    <rect width="150" height="30" rx="15" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="140" cy="355" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="208" y="360" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AVAILABLE FOR HIRE</text>
  </g>
</svg>
